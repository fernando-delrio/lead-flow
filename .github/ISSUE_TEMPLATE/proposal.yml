name: Propose an improvement
description: Propose a change before investing time in its implementation.
title: "[Proposal]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem you want to solve
      description: Describe who experiences it and in what situation, without starting from a solution.
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Expected outcome
      description: Explain what a person could do once the improvement exists.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Include manual workarounds or existing tools, if any.
  - type: textarea
    id: scope
    attributes:
      label: What you would leave out
      description: An explicit boundary helps turn the proposal into a reviewable task.
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched the open issues for similar proposals.
          required: true
        - label: I will agree on the scope before opening a large pull request.
          required: true
        - label: I accept the project code of conduct.
          required: true
