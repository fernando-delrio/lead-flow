name: Propose a pilot team
description: Tell us where you would like to try lead-flow when phase 1 is ready.
title: "[Pilot]: "
body:
  - type: markdown
    attributes:
      value: |
        `lead-flow` is still under construction. Do not include client names, private repositories,
        credentials, or contractual information.
  - type: input
    id: team
    attributes:
      label: Approximate team type and size
      placeholder: Consultancy, 6 developers
    validations:
      required: true
  - type: input
    id: stack
    attributes:
      label: Main stack
      placeholder: TypeScript, React, and Node.js
    validations:
      required: true
  - type: textarea
    id: workflow
    attributes:
      label: How you use AI agents
      description: Tools, frequency, and the parts of the workflow where they participate.
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What problem you want to test
      description: Review, security, traceability, lead workload, or another specific problem.
    validations:
      required: true
  - type: textarea
    id: limits
    attributes:
      label: Pilot constraints
      description: Technical, privacy, or time constraints that can be shared publicly.
  - type: checkboxes
    id: checks
    attributes:
      label: Confirmation
      options:
        - label: I understand that lead-flow does not have a stable version yet.
          required: true
        - label: The published information does not identify clients or expose private data.
          required: true
        - label: I accept the project code of conduct.
          required: true
