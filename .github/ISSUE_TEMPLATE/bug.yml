name: Report a bug
description: Describe reproducible behaviour that does not match what you expected.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thank you for helping. Do not publish credentials, client data, or vulnerabilities.
        For a security issue, use the private channel described in SECURITY.md.
  - type: textarea
    id: problem
    attributes:
      label: What happened
      description: Explain the behaviour you observed and why it is a problem.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Include the commands and the smallest example required.
      placeholder: |
        1. Run…
        2. Configure…
        3. Observe…
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: v0.1.0 or abc1234
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Operating system and Node.js and npm versions.
      placeholder: Windows 11, Node.js 22.12.0, npm 10.9.0
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant output
      description: Remove every secret or private value first.
      render: shell
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched for an open issue describing the same problem.
          required: true
        - label: The published information contains no secrets or third-party data.
          required: true
        - label: I accept the project code of conduct.
          required: true
